services:
  db:
    image: postgres:16
    container_name: sports_card_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sports_cards}
    ports:
      # Host port defaults to 5433 so it doesn't collide with a Postgres already
      # running on the Mac. The backend talks to the db over the compose network.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sports_cards}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema + demo seed are applied by the backend on startup (idempotent).

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sports_card_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sports_cards}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/srv/backend/app
      - ./scripts:/srv/scripts:ro
      - ./seed:/srv/seed:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: sports_card_frontend
    environment:
      # Server-side calls go container-to-container; "localhost" inside this
      # container would point at the frontend itself.
      API_BASE_URL: http://backend:8000
      API_KEY: ${API_KEY:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
